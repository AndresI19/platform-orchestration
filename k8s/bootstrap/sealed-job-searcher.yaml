# Secrets for the job-searcher service, mounted as READ-ONLY FILES at /etc/.secrets (the data-key
# names ARE the filenames). Ciphertext only — strict-scoped to platform/job-searcher-secrets.
#
#   apify-token        — sealed. The LinkedIn-ingest Apify credential.
#   anthropic-api-key  — NOT YET SET. The service runs JUDGE_BACKEND=api in-cluster; a real (admin)
#                        run will fail at judge time until this key is added. The open mock/preview
#                        is unaffected. To add it (merges into this SealedSecret without disturbing
#                        apify-token), from platform-orchestration/ with the key in a temp env-file:
#
#     printf 'anthropic-api-key=%s\n' "$YOUR_KEY" > /tmp/k.env
#     kubectl create secret generic job-searcher-secrets -n platform --from-env-file=/tmp/k.env \
#       --dry-run=client -o yaml \
#       | kubeseal --format yaml --controller-namespace kube-system --scope strict \
#           --merge-into k8s/bootstrap/sealed-job-searcher.yaml
#     rm -f /tmp/k.env
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: job-searcher-secrets
  namespace: platform
spec:
  encryptedData:
    apify-token: 
  template:
    metadata:
      name: job-searcher-secrets
      namespace: platform
